<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e66">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>사진 올리기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="app-name">찍올</h1>
    <a href="pc.html">PC에서 받기</a>
  </header>

  <div class="notice bad" id="bootMsg" hidden></div>

  <section class="panel">
    <div class="muted">내 코드 (PC에서 이 코드를 입력합니다)</div>
    <div class="codebox">
      <div class="code" id="code">····-····</div>
      <button class="linkbtn" id="newCode" type="button">새 코드</button>
    </div>
  </section>

  <section class="panel">
    <div class="two">
      <label for="camInput" class="btn">찍기</label>
      <label for="fileInput" class="btn ghost">사진 고르기</label>
    </div>
    <!-- label for 방식만 사용. 자바스크립트로 click()을 호출하지 않습니다. -->
    <input id="camInput" class="file-hidden" type="file" accept="image/*" capture="environment">
    <input id="fileInput" class="file-hidden" type="file" accept="image/*" multiple>
    <p class="muted" id="hint" style="margin:10px 0 0">찍거나 고른 사진이 아래에 번호와 함께 표시됩니다.</p>
  </section>

  <section class="panel" id="queuePanel" hidden>
    <div class="summary">
      <b id="sumMain">0장</b>
      <span class="muted" id="sumSub"></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="grid" id="grid"></div>
    <div class="stack" style="margin-top:14px">
      <button class="btn" id="uploadBtn" type="button" disabled>올리기</button>
      <button class="btn danger" id="retryBtn" type="button" hidden>실패한 사진 다시 올리기</button>
      <button class="btn ghost" id="clearBtn" type="button" hidden>목록 비우기</button>
    </div>
  </section>

  <section class="done-box" id="doneBox" hidden>
    <b id="doneTitle"></b>
    <div style="margin-top:6px">PC에서 아래 주소로 접속해 코드 <b id="doneCode"></b> 를 입력하세요.</div>
    <div class="url" id="pcUrl"></div>
  </section>

  <p class="muted" style="margin-top:18px">
    올리는 동안에는 이 화면을 켜 두세요. 개인정보나 민감한 자료가 담긴 사진은 올리지 마세요.
  </p>
</div>

<script src="config.js"></script>
<script>
  // 앱 본체(app.js)가 8초 안에 뜨지 않으면 안내
  window.__booted = false;
  setTimeout(function () {
    if (!window.__booted) {
      var m = document.getElementById("bootMsg");
      m.textContent = "앱을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.";
      m.hidden = false;
    }
  }, 8000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
<script type="module" src="app.js"></script>
</body>
</html>
