<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사진 받기</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <h1><span class="app-name">찍올</span> 사진 받기</h1>
    <a href="index.html">폰에서 올리기</a>
  </header>

  <div class="notice bad" id="bootMsg" hidden></div>

  <section class="panel">
    <form class="code-form" id="codeForm">
      <input id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false"
             maxlength="9" placeholder="코드 8자리" aria-label="코드">
      <button class="btn" type="submit">사진 보기</button>
    </form>
    <p class="muted" style="margin:10px 0 0">폰 앱 첫 화면에 보이는 "내 코드"를 입력하세요.</p>
  </section>

  <section id="listPanel" hidden>
    <div class="toolbar">
      <b id="count"></b>
      <span class="grow"></span>
      <button class="btn small ghost" id="selAll" type="button">전체 선택</button>
      <button class="btn small" id="dlZip" type="button">압축파일로 받기</button>
      <button class="btn small ghost" id="dlSel" type="button">하나씩 받기</button>
      <button class="btn small danger" id="delSel" type="button">선택한 사진 지우기</button>
      <button class="btn small ghost" id="reload" type="button">새로고침</button>
    </div>
    <p class="muted" id="hintSel" style="margin:-4px 0 12px">사진을 골라 누르면 고른 사진만, 아무것도 고르지 않으면 전체를 받습니다. 받은 사진은 서버에서 바로 지워집니다.</p>
    <div class="notice bad" id="zipMsg" hidden></div>
    <div class="done-box" id="resultMsg" hidden style="margin-bottom:12px"></div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="empty" hidden>이 코드로 올린 사진이 없습니다. 코드를 다시 확인하세요.</div>
  </section>
  <p class="muted" style="text-align:center; font-size:12px">버전 3</p>
</div>

<script src="config.js?v=3"></script>
<script>
  window.__booted = false;
  setTimeout(function () {
    if (!window.__booted) {
      var m = document.getElementById("bootMsg");
      m.textContent = "화면을 불러오지 못했습니다. 이 PC의 네트워크에서 필요한 주소(gstatic.com, googleapis.com)가 막혀 있을 수 있습니다.";
      m.hidden = false;
    }
  }, 8000);
</script>
<script type="module" src="pc.js?v=3"></script>
</body>
</html>
